[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airecogniser"
description = "Local audio/video transcription, summaries and knowledge base for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alexey Aseev" }]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "platformdirs>=4.3,<5",
    "psutil>=6.0,<8",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
shell = [
    "pywebview>=5.3,<6",
    "pystray>=0.19,<1",
    "pillow>=10.4,<13",
    "httpx>=0.27,<1",
]
asr = [
    "onnx-asr[cpu,hub]>=0.10,<1",
    "onnxruntime>=1.20,<2",
    "numpy>=1.26,<3",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
    "httpx>=0.27,<1",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
airec = "airec.__main__:main"

[tool.setuptools]
package-dir = { "" = "app" }

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.dynamic]
version = { attr = "airec.version.__version__" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "shell"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app", "."]
addopts = "-q"

[tool.coverage.run]
source = ["airec"]
